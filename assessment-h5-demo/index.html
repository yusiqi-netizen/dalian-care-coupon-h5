<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f3f9f6">
  <title>老年人体适能测评</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="phone-shell" id="app">
    <section class="screen-stage" id="screenStage">
      <img class="screen-image" id="screenImage" alt="老年人体适能测评页面">
      <button class="tap-zone tap-back" id="backButton" aria-label="返回上一页"></button>
      <button class="tap-zone tap-next" id="nextButton" aria-label="继续下一步"></button>
      <nav class="test-tabs" id="testTabs" aria-label="八项测试快速切换" hidden></nav>
      <div class="form-hotspots" id="formHotspots" hidden>
        <button class="gender-control selected" data-form="gender" data-value="男" style="--x:9%;--y:19.8%;--w:38%;--h:3.7%">男</button>
        <button class="gender-control" data-form="gender" data-value="女" style="--x:53%;--y:19.8%;--w:38%;--h:3.7%">女</button>
        <button class="step-control minus" aria-label="年龄减一" data-form="age" data-delta="-1" style="--x:18%;--y:31%;--w:28px;--h:28px">−</button>
        <output class="number-value" data-value-for="age" style="--x:35%;--y:30.5%;--w:30%;--h:3.6%">59岁</output>
        <button class="step-control plus" aria-label="年龄加一" data-form="age" data-delta="1" style="--x:76%;--y:31%;--w:28px;--h:28px">＋</button>
        <button class="step-control minus" aria-label="身高减一" data-form="height" data-delta="-1" style="--x:18%;--y:41.8%;--w:28px;--h:28px">−</button>
        <output class="number-value" data-value-for="height" style="--x:34%;--y:41.3%;--w:32%;--h:3.6%">170厘米</output>
        <button class="step-control plus" aria-label="身高加一" data-form="height" data-delta="1" style="--x:76%;--y:41.8%;--w:28px;--h:28px">＋</button>
        <button class="step-control minus" aria-label="体重减一" data-form="weight" data-delta="-1" style="--x:18%;--y:52.6%;--w:28px;--h:28px">−</button>
        <output class="number-value" data-value-for="weight" style="--x:34%;--y:52.1%;--w:32%;--h:3.6%">65公斤</output>
        <button class="step-control plus" aria-label="体重加一" data-form="weight" data-delta="1" style="--x:76%;--y:52.6%;--w:28px;--h:28px">＋</button>
        <button class="habit-control selected" data-form="habit" data-value="几乎不运动" style="--x:9%;--y:64.1%;--w:82%;--h:3.9%"><i></i>几乎不运动</button>
        <button class="habit-control" data-form="habit" data-value="偶尔运动" style="--x:9%;--y:68.7%;--w:82%;--h:3.9%"><i></i>偶尔运动</button>
        <button class="habit-control" data-form="habit" data-value="每周 1～2 次" style="--x:9%;--y:73.3%;--w:82%;--h:3.9%"><i></i>每周 1～2 次</button>
        <button class="habit-control" data-form="habit" data-value="每周 3 次以上" style="--x:9%;--y:77.9%;--w:82%;--h:3.9%"><i></i>每周 3 次以上</button>
        <button class="habit-control" data-form="habit" data-value="长期规律运动" style="--x:9%;--y:82.5%;--w:82%;--h:3.9%"><i></i>长期规律运动</button>
        <output id="formFeedback" aria-live="polite"></output>
      </div>
      <button class="speech-hotspot" id="speechHotspot" aria-label="播放或暂停当前说明" hidden></button>
      <output class="live-time" id="liveTime" aria-live="polite" hidden></output>
      <div class="demo-toolbar">
        <button id="voiceButton" aria-label="切换语音">语音开</button>
        <span id="progressText"></span>
      </div>
      <div class="flow-status" id="flowStatus" aria-live="polite"></div>
    </section>
    <section class="detail-view" id="detailView" hidden></section>
    <div class="welcome-mask" id="welcomeMask">
      <div class="welcome-card">
        <img src="./assets/icon-report.png" alt="">
        <h1>老年人体适能测评</h1>
        <p>点击开始后将开启语音引导。您可以按照页面中的按钮体验完整测评流程。</p>
        <button id="startButton">开启语音体验</button>
      </div>
    </div>
    <audio id="narration" preload="auto"></audio>
  </main>
  <script src="./app.js"></script>
</body>
</html>
