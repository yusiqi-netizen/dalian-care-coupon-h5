<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f3f9f6">
  <title>老年人体适能测评</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="phone-shell" id="app">
    <section class="screen-stage" id="screenStage">
      <img class="screen-image" id="screenImage" alt="老年人体适能测评页面">
      <button class="tap-zone tap-back" id="backButton" aria-label="返回上一页"></button>
      <button class="tap-zone tap-next" id="nextButton" aria-label="继续下一步"></button>
      <button class="primary-action-hotspot" id="primaryActionHotspot" aria-label="执行当前页面主操作" hidden></button>
      <nav class="test-tabs" id="testTabs" aria-label="八项测试快速切换" hidden></nav>
      <div class="form-hotspots" id="formHotspots" hidden>
        <section class="form-card">
          <h2>性别 <small>（必填）</small></h2>
          <div class="gender-row">
            <button class="gender-control selected" data-form="gender" data-value="男">男</button>
            <button class="gender-control" data-form="gender" data-value="女">女</button>
          </div>
        </section>
        <section class="form-card compact">
          <h2>年龄 <small>（必填）</small></h2>
          <div class="stepper-row">
            <button class="step-control" aria-label="年龄减一" data-form="age" data-delta="-1">−</button>
            <output class="number-value" data-value-for="age">59岁</output>
            <button class="step-control" aria-label="年龄加一" data-form="age" data-delta="1">＋</button>
          </div>
        </section>
        <section class="form-card compact">
          <h2>身高 <small>（选填）</small></h2>
          <div class="stepper-row">
            <button class="step-control" aria-label="身高减一" data-form="height" data-delta="-1">−</button>
            <output class="number-value" data-value-for="height">170厘米</output>
            <button class="step-control" aria-label="身高加一" data-form="height" data-delta="1">＋</button>
          </div>
        </section>
        <section class="form-card compact">
          <h2>体重 <small>（选填）</small></h2>
          <div class="stepper-row">
            <button class="step-control" aria-label="体重减一" data-form="weight" data-delta="-1">−</button>
            <output class="number-value" data-value-for="weight">65公斤</output>
            <button class="step-control" aria-label="体重加一" data-form="weight" data-delta="1">＋</button>
          </div>
        </section>
        <section class="form-card habits-card">
          <h2>运动习惯 <small>（选填）</small></h2>
          <button class="habit-control selected" data-form="habit" data-value="几乎不运动"><i></i>几乎不运动</button>
          <button class="habit-control" data-form="habit" data-value="偶尔运动"><i></i>偶尔运动</button>
          <button class="habit-control" data-form="habit" data-value="每周 1～2 次"><i></i>每周 1～2 次</button>
          <button class="habit-control" data-form="habit" data-value="每周 3 次以上"><i></i>每周 3 次以上</button>
          <button class="habit-control" data-form="habit" data-value="长期规律运动"><i></i>长期规律运动</button>
        </section>
        <button class="form-submit" data-form="submit">提交</button>
        <output id="formFeedback" aria-live="polite"></output>
      </div>
      <button class="speech-hotspot" id="speechHotspot" aria-label="播放或暂停当前说明" hidden></button>
      <section class="dynamic-test-panel" id="dynamicTestPanel" hidden>
        <div class="dynamic-countdown-label">倒计时 5 秒后开始</div>
        <output class="live-time" id="liveTime" aria-live="polite"></output>
        <div class="dynamic-time-units"><span>分钟</span><span>秒</span></div>
        <button class="dynamic-complete" id="dynamicComplete">完成测试</button>
      </section>
      <div class="demo-toolbar">
        <button id="voiceButton" aria-label="切换语音">语音开</button>
        <span id="progressText"></span>
      </div>
      <div class="flow-status" id="flowStatus" aria-live="polite"></div>
    </section>
    <section class="detail-view" id="detailView" hidden></section>
    <div class="welcome-mask" id="welcomeMask">
      <div class="welcome-card">
        <img src="./assets/icon-report.png" alt="">
        <h1>老年人体适能测评</h1>
        <p>点击开始后将开启语音引导。您可以按照页面中的按钮体验完整测评流程。</p>
        <button id="startButton">开启语音体验</button>
      </div>
    </div>
    <audio id="narration" preload="auto"></audio>
  </main>
  <script src="./app.js"></script>
</body>
</html>
